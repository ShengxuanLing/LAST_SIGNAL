<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">LAST SIGNAL — banner</title>
  <desc id="d">Dark navy banner with a cyan LAST SIGNAL title, an orange SIGNAL LOST. SIGNAL REMAINS. tagline and a thin cyan isometric grid.</desc>

  <defs>
    <!-- background vignette: #0b1420 center -> #04060b edge -->
    <radialGradient id="bg" cx="50%" cy="46%" r="78%">
      <stop offset="0%"  stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>

    <!-- soft cyan glow behind the title -->
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#33e0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#33e0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- legibility shade behind text (left side) -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#05070c" stop-opacity="0.92"/>
      <stop offset="48%"  stop-color="#05070c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </linearGradient>

    <!-- thin cyan isometric grid (2:1 tiles, TILE_W=64 TILE_H=32) -->
    <pattern id="iso" width="64" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0 L64 32 M0 32 L64 0" fill="none"
            stroke="#33e0ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <!-- mask that fades the grid at the extreme edges -->
    <radialGradient id="gridFade" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="82%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect x="0" y="0" width="1280" height="320" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- base + vignette -->
  <rect x="0" y="0" width="1280" height="320" fill="#05070c"/>
  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)"/>

  <!-- isometric grid -->
  <rect x="0" y="0" width="1280" height="320" fill="url(#iso)" mask="url(#gridMask)"/>

  <!-- left legibility shade -->
  <rect x="0" y="0" width="720" height="320" fill="url(#shade)"/>

  <!-- corner brackets -->
  <g stroke="#33e0ff" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M22 46 L22 22 L46 22"/>
    <path d="M1258 46 L1258 22 L1234 22"/>
    <path d="M22 274 L22 298 L46 298"/>
    <path d="M1258 274 L1258 298 L1234 298"/>
  </g>

  <!-- top labels -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#5a7480" font-size="15" letter-spacing="3">
    <text x="46" y="52">SYS://LAST_SIGNAL</text>
    <text x="1234" y="52" text-anchor="end">V0.1.0 // ARCHIVE</text>
  </g>

  <!-- title glow + title -->
  <ellipse cx="380" cy="168" rx="430" ry="120" fill="url(#tglow)"/>
  <text x="80" y="196" font-family="Consolas, 'Courier New', monospace"
        font-size="98" font-weight="700" letter-spacing="10" fill="#33e0ff">LAST SIGNAL</text>

  <!-- thin rule with orange accent square -->
  <g>
    <rect x="84" y="216" width="9" height="9" fill="#ff8a3c"/>
    <line x1="104" y1="220" x2="900" y2="220" stroke="#33e0ff" stroke-opacity="0.40" stroke-width="1.5"/>
  </g>

  <!-- tagline -->
  <text x="84" y="258" font-family="Consolas, 'Courier New', monospace"
        font-size="27" font-weight="700" letter-spacing="6" fill="#ff8a3c">SIGNAL LOST. SIGNAL REMAINS.</text>

  <!-- signature waveform: cyan "alive" pulses, then an orange dashed "lost" gap -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M84 294 L122 294 L130 284 L138 294 L300 294 L320 294 L330 266 L340 294
             L520 294 L528 284 L536 294 L700 294 L720 294 L730 272 L740 294 L880 294"
          stroke="#33e0ff" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M902 294 L1000 294" stroke="#ff8a3c" stroke-opacity="0.75"
          stroke-width="2" stroke-dasharray="11 7"/>
  </g>

  <!-- right-side "radar" emblem: concentric diamonds -->
  <g fill="none" stroke="#33e0ff">
    <path d="M1092 36 L1216 160 L1092 284 L968 160 Z"  stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M1092 68 L1184 160 L1092 252 L1000 160 Z" stroke-opacity="0.40" stroke-width="1.5"/>
    <path d="M1092 100 L1152 160 L1092 220 L1032 160 Z" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M1092 130 L1122 160 L1092 190 L1062 160 Z" stroke-opacity="0.75" stroke-width="1.5"/>
    <path d="M1092 148 L1104 160 L1092 172 L1080 160 Z" fill="#ff8a3c" stroke="#ff8a3c" stroke-opacity="0.9"/>
  </g>
  <g fill="#33e0ff" fill-opacity="0.8">
    <circle cx="1092" cy="36"  r="2.4"/>
    <circle cx="1216" cy="160" r="2.4"/>
    <circle cx="1092" cy="284" r="2.4"/>
    <circle cx="968"  cy="160" r="2.4"/>
  </g>

  <!-- bottom-right micro label -->
  <text x="1234" y="288" text-anchor="end" font-family="Consolas, 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#5a7480">SIGNAL STATUS: UNRESOLVED</text>
</svg>
