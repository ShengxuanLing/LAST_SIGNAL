name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / 单测 / 构建 / 端到端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20（npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium 与系统依赖
        run: npx playwright install --with-deps chromium

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 浏览器回归
        run: npm run playwright -- --reporter=line --workers=1

      - name: 验证生产入口
        run: npm run test:preview -- --reporter=line --workers=1

      - name: 验证补给版生产入口
        env:
          LS_PREVIEW_MODE: economy
        run: |
          npm run build:economy
          npm run test:preview -- --reporter=line --workers=1
