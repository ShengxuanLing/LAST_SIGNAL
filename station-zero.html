<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LAST SIGNAL · Station Zero：观测实验室与失稳走廊" />
    <title>LAST SIGNAL · Station Zero</title>
  </head>
  <body>
    <main id="game" aria-label="Station Zero 原型"></main>

    <div id="vs00-hud">
      <section class="vs00-panel vs00-top-left" aria-live="polite">
        <div class="vs00-label">能量</div>
        <div class="vs00-value" data-testid="vs00-energy" data-energy="100">100 / 100</div>
        <div class="vs00-scan" data-testid="vs00-scan-details" data-revealed="0">
          未扫描。按 Z 或点“扫描”。
        </div>
      </section>

      <section class="vs00-panel vs00-top-right" aria-live="polite">
        <div id="lab-readout">
          <div class="vs00-label">门</div>
          <div class="vs00-value" data-testid="vs00-door-state" data-state="SEALED">封锁中（不可通行）</div>
        </div>
        <div id="corridor-readout" hidden>
          <div class="vs00-label">失稳走廊</div>
          <div class="vs00-value" data-testid="vs01-bridge-state"></div>
          <div class="vs00-scan" data-testid="vs01-relay-state"></div>
          <div class="vs00-scan" data-testid="vs01-health"></div>
        </div>
      </section>

      <section class="vs00-complete" data-testid="vs00-complete" data-complete="0">尚未通过门</section>

      <section class="vs00-panel vs00-bottom-left" aria-live="assertive">
        <div class="vs00-label">反馈</div>
        <div class="vs00-feedback" data-testid="vs00-feedback" data-code="OK" data-cost="0">
          WASD 移动 · Z 扫描 · X 压制 · F 开门尝试 · Esc 暂停
        </div>
      </section>

      <section class="vs00-panel vs00-bottom-right" aria-live="polite">
        <div class="vs00-label">位置</div>
        <div class="vs00-value" data-testid="vs00-player-position" data-x="3.5" data-y="5.5">3.5, 5.5</div>
      </section>

      <nav class="vs00-buttons" aria-label="操作">
        <button type="button" data-testid="vs00-btn-scan">扫描</button>
        <button type="button" data-testid="vs00-btn-jam">压制</button>
        <button type="button" data-testid="vs01-btn-jam-guard" hidden>压制守卫</button>
        <button type="button" data-testid="vs00-btn-interact">开门尝试</button>
        <button type="button" data-testid="vs00-btn-pause">暂停</button>
        <button type="button" data-testid="vs00-btn-restart">重开</button>
        <button type="button" data-testid="vs00-btn-save">保存</button>
      </nav>

      <p class="vs00-hint" id="slice-hint">
        目标：用真实操作打开被封锁的门并走到另一侧。能量不足时请等待自然恢复。
      </p>
    </div>

    <script type="module" src="/src/slice/main.ts"></script>
  </body>
</html>
