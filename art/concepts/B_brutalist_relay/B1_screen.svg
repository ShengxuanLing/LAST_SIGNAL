<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Bahnschrift', 'Segoe UI', sans-serif">
  <title>CONCEPT B · BRUTALIST RELAY — game screen concept (not an in-game capture)</title>
  <!-- Same room/camera/moment as A1 and C1. Monumental cast concrete, sodium work-lights,
       oxidised patina, 150px walls; the human is small inside infrastructure. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e10"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="wR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a46"/><stop offset="0.6" stop-color="#3a3a37"/><stop offset="1" stop-color="#232322"/>
    </linearGradient>
    <linearGradient id="wL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d2b"/><stop offset="1" stop-color="#171716"/>
    </linearGradient>
    <radialGradient id="sodium" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ff9a2e" stop-opacity="0.18"/><stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="relayGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe8ff" stop-opacity="0.6"/><stop offset="1" stop-color="#cfe8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grate" width="16" height="8" patternUnits="userSpaceOnUse" patternTransform="matrix(1 0.5 -1 0.5 0 0)">
      <rect width="16" height="8" fill="#262624"/>
      <rect x="1" y="1" width="14" height="6" fill="#1a1a19"/>
    </pattern>
    <pattern id="hazard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1c1c1b"/><rect width="6" height="12" fill="#c9922f"/>
    </pattern>
    <pattern id="formwork" width="40" height="18" patternUnits="userSpaceOnUse" patternTransform="matrix(1 0.5 0 1 0 0)">
      <rect width="40" height="18" fill="none"/>
      <path d="M0 17.5 H40" stroke="#000" stroke-opacity="0.25"/>
      <circle cx="20" cy="9" r="1.2" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- abyss beyond the slab: distant megastructure silhouettes -->
  <g fill="#121314">
    <rect x="40" y="420" width="70" height="300"/><rect x="130" y="470" width="40" height="250"/>
    <rect x="1120" y="440" width="90" height="280"/><rect x="1060" y="520" width="40" height="200"/>
  </g>
  <g fill="#ffb347" opacity="0.55"><rect x="58" y="450" width="4" height="4"/><rect x="1150" y="470" width="4" height="4"/><rect x="1180" y="530" width="4" height="4"/></g>

  <!-- floor slab with grating channel + concrete plates -->
  <polygon points="640,150 1088,374 704,566 256,342" fill="#2f2f2d"/>
  <g transform="matrix(32 16 -32 16 640 150)" fill="none" stroke="#000" stroke-opacity="0.35">
    <path vector-effect="non-scaling-stroke" d="M3.5 0V12M7 0V12M10.5 0V12M0 4H14M0 8H14"/>
  </g>
  <!-- grating trench across room (gy 8..9) -->
  <polygon points="384,278 832,502 800,518 352,294" fill="url(#grate)"/>
  <polyline points="384,278 832,502" fill="none" stroke="#6b6b64" stroke-opacity="0.6"/>
  <!-- slab edge: 40px cast thickness with bevel -->
  <polygon points="256,342 704,566 704,606 256,382" fill="#1a1a19"/>
  <polygon points="704,566 1088,374 1088,414 704,606" fill="#232322"/>
  <polyline points="256,342 704,566 1088,374" fill="none" stroke="#6b6b64" stroke-width="2"/>
  <!-- hazard lip at chasm side -->
  <polygon points="560,494 704,566 704,576 560,504" fill="url(#hazard)"/>

  <!-- walls: 150px tall, ribbed buttresses, formwork marks, patina streaks -->
  <polygon points="640,150 1088,374 1088,224 640,0" fill="url(#wR)"/>
  <polygon points="640,150 1088,374 1088,224 640,0" fill="url(#formwork)"/>
  <polygon points="640,150 256,342 256,192 640,0" fill="url(#wL)"/>
  <g fill="#1b1b1a">
    <polygon points="760,210 784,222 784,72 760,60"/><polygon points="900,280 924,292 924,142 900,130"/>
    <polygon points="520,210 496,222 496,72 520,60"/><polygon points="380,280 356,292 356,142 380,130"/>
  </g>
  <g fill="#3e6b66" opacity="0.55">
    <polygon points="820,110 826,113 828,220 822,236 818,214"/><polygon points="1040,220 1046,223 1046,320 1042,340 1038,316"/>
    <polygon points="440,170 446,167 445,250 441,266 438,246"/>
  </g>
  <!-- huge stencil -->
  <text transform="matrix(0.894 0.447 0 1 790 150)" font-size="54" font-weight="bold" fill="#000" fill-opacity="0.28" letter-spacing="4">R-02</text>
  <!-- blast door (gx 9..11): heavy, hazard frame, closed -->
  <polygon points="920,290 1000,330 1000,224 920,184" fill="url(#hazard)"/>
  <polygon points="928,290 992,322 992,236 928,204" fill="#27292a"/>
  <path d="M960,306 V220" stroke="#111" stroke-width="2"/>
  <rect x="954" y="244" width="12" height="18" fill="#c9922f"/>
  <!-- receiver lamp: interactive patina-cyan -->
  <circle cx="1010" cy="214" r="7" fill="#5fd3c4"/><circle cx="1010" cy="214" r="16" fill="#5fd3c4" opacity="0.25"/>

  <!-- sodium work-light pools (environment light; not a gameplay colour) -->
  <ellipse cx="460" cy="300" rx="190" ry="95" fill="url(#sodium)"/>
  <ellipse cx="860" cy="420" rx="160" ry="80" fill="url(#sodium)" opacity="0.7"/>
  <!-- lamp housings on walls -->
  <g fill="#111"><rect x="452" y="160" width="18" height="10"/><rect x="852" y="250" width="18" height="10"/></g>
  <g fill="#ffd28a"><rect x="455" y="168" width="12" height="3"/><rect x="855" y="258" width="12" height="3"/></g>

  <!-- relay mast R-2: monolith with cable bundle feeding the door -->
  <g transform="translate(672 198)">
    <ellipse cy="10" rx="40" ry="16" fill="#000" opacity="0.55"/>
    <polygon points="-22,4 0,15 22,4 22,-110 0,-99 -22,-110" fill="#3b3c3a"/>
    <polygon points="0,15 22,4 22,-110 0,-99" fill="#2a2b2a"/>
    <polygon points="-22,-110 0,-121 22,-110 0,-99" fill="#55554f"/>
    <g fill="#cfe8ff"><rect x="-14" y="-90" width="10" height="3"/><rect x="-14" y="-80" width="10" height="3"/><rect x="-14" y="-70" width="10" height="3" opacity="0.4"/></g>
    <ellipse cx="0" cy="-128" rx="40" ry="22" fill="url(#relayGlow)"/>
    <rect x="-4" y="-150" width="8" height="30" fill="#55554f"/>
    <circle cx="0" cy="-152" r="5" fill="#eaf4ff"/>
  </g>
  <!-- cable tray: the signal path is physical; signal pulses ride it -->
  <path d="M694,120 C770,140 860,170 990,214" fill="none" stroke="#151515" stroke-width="7"/>
  <path d="M694,120 C770,140 860,170 990,214" fill="none" stroke="#cfe8ff" stroke-width="2" stroke-dasharray="3 22"/>
  <g fill="#eaf4ff"><circle cx="780" cy="143" r="3.5"/><circle cx="890" cy="180" r="3.5"/></g>

  <!-- props: barrels, a toppled cart, cable spill -->
  <g>
    <ellipse cx="1000" cy="402" rx="36" ry="12" fill="#000" opacity="0.5"/>
    <rect x="976" y="372" width="22" height="30" fill="#3e6b66"/><ellipse cx="987" cy="372" rx="11" ry="5" fill="#5a8a84"/>
    <rect x="1000" y="378" width="22" height="26" fill="#3a3a37"/><ellipse cx="1011" cy="378" rx="11" ry="5" fill="#55554f"/>
    <path d="M300,360 q40,20 90,6 q30,-6 60,10" fill="none" stroke="#111" stroke-width="4"/>
  </g>

  <!-- loot: brass core canister -->
  <g transform="translate(480 358)">
    <ellipse cy="4" rx="12" ry="5" fill="#000" opacity="0.5"/>
    <rect x="-6" y="-18" width="12" height="20" rx="2" fill="#d8b25a"/><rect x="-6" y="-12" width="12" height="4" fill="#7a5d22"/>
  </g>
  <!-- hunter: suspended crane-pod -->
  <g transform="translate(640 246)">
    <path d="M0,-120 V-44" stroke="#111" stroke-width="2"/>
    <ellipse cy="10" rx="16" ry="6" fill="#000" opacity="0.45"/>
    <polygon points="-16,-44 16,-44 20,-24 0,-12 -20,-24" fill="#2a2b2a"/>
    <rect x="-16" y="-44" width="32" height="6" fill="url(#hazard)"/>
    <circle cx="0" cy="-26" r="5" fill="#e8452c"/>
  </g>
  <!-- drone: welding/inspection quadcopter -->
  <g transform="translate(864 358)">
    <ellipse cy="6" rx="22" ry="8" fill="#000" opacity="0.5"/>
    <rect x="-14" y="-38" width="28" height="16" fill="#3a3b39"/>
    <path d="M-26,-40 h14 M12,-40 h14" stroke="#555" stroke-width="3"/>
    <circle cx="0" cy="-30" r="5" fill="#e8452c"/>
    <!-- hit: sparks + concrete chips -->
    <g stroke="#ffd28a" stroke-width="2" stroke-linecap="round"><path d="M-16,-32 l-12,-6 M-14,-26 l-14,2 M-12,-38 l-6,-10"/></g>
    <g fill="#8a8a82"><rect x="-30" y="-20" width="3" height="3"/><rect x="-24" y="-12" width="2" height="2"/></g>
  </g>
  <text x="834" y="298" font-size="18" font-weight="bold" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">18</text>
  <!-- stalker: hydraulic floor-grabber -->
  <g transform="translate(736 454)">
    <ellipse cy="4" rx="26" ry="9" fill="#000" opacity="0.55"/>
    <polygon points="-22,0 22,0 16,-20 -16,-20" fill="#3a3b39"/>
    <rect x="-22" y="-6" width="44" height="6" fill="url(#hazard)"/>
    <path d="M-16,-20 l-14,-14 M16,-20 l14,-14" stroke="#555" stroke-width="5"/>
    <rect x="-6" y="-17" width="12" height="4" fill="#e8452c"/>
  </g>
  <g fill="#e8452c"><circle cx="784" cy="404" r="4"/><circle cx="702" cy="304" r="4"/></g>

  <!-- PLAYER: signal-white workwear hardsuit, patina visor, chest beacon -->
  <g transform="translate(608 358)">
    <ellipse rx="44" ry="20" fill="#cfe8ff" opacity="0.1"/>
    <ellipse cy="2" rx="16" ry="6" fill="#000" opacity="0.6"/>
    <path d="M-7,0 L-7,-14 M7,0 L7,-14" stroke="#c8ccc8" stroke-width="6"/>
    <rect x="-13" y="-38" width="26" height="26" rx="4" fill="#e9ecea"/>
    <rect x="-17" y="-36" width="8" height="18" fill="#9aa09b"/>
    <rect x="-9" y="-50" width="18" height="14" rx="3" fill="#e9ecea"/>
    <rect x="-4" y="-47" width="12" height="6" fill="#5fd3c4"/>
    <circle cx="0" cy="-26" r="3" fill="#cfe8ff"/>
    <path d="M8,-26 L32,-24" stroke="#222" stroke-width="5"/>
  </g>
  <!-- player shots: white-hot slugs with short tracer -->
  <g stroke-linecap="round"><path d="M680,345 L724,345" stroke="#cfe8ff" stroke-width="4" opacity="0.6"/><path d="M780,339 L824,338" stroke="#cfe8ff" stroke-width="4" opacity="0.6"/></g>
  <g fill="#fff"><circle cx="726" cy="345" r="3"/><circle cx="826" cy="338" r="3"/></g>

  <!-- foreground occluder: pipe run crossing the camera (depth layer) -->
  <path d="M-20,600 L520,720" stroke="#0c0c0c" stroke-width="40"/>
  <path d="M-20,584 L520,704" stroke="#262624" stroke-width="4"/>

  <!-- HUD: stamped steel plates -->
  <g font-family="'Bahnschrift', 'Segoe UI', sans-serif">
    <g transform="translate(24 22)">
      <polygon points="0,0 250,0 262,12 262,58 0,58" fill="#151514" stroke="#55554f"/>
      <text x="12" y="18" font-size="11" fill="#9a9a90" letter-spacing="2">OPERATIVE 07</text>
      <rect x="12" y="26" width="200" height="10" fill="#262624"/><rect x="12" y="26" width="144" height="10" fill="#e9ecea"/>
      <text x="218" y="35" font-size="12" fill="#e9ecea">72</text>
      <rect x="12" y="42" width="200" height="6" fill="#262624"/><rect x="12" y="42" width="128" height="6" fill="#5fd3c4"/>
      <text x="218" y="49" font-size="10" fill="#5fd3c4">SIG 64</text>
    </g>
    <g transform="translate(24 610)">
      <g><rect width="66" height="70" fill="#151514" stroke="#55554f"/><rect width="66" height="14" fill="#55554f"/><text x="6" y="11" font-size="10" fill="#111">Z SCAN</text><circle cx="33" cy="42" r="14" fill="none" stroke="#e9ecea" stroke-width="2"/><text x="6" y="66" font-size="9" fill="#9a9a90">10</text></g>
      <g transform="translate(74 0)"><rect width="66" height="70" fill="#151514" stroke="#5fd3c4"/><rect width="66" height="14" fill="#5fd3c4"/><text x="6" y="11" font-size="10" fill="#111">X JAM</text><path d="M18,42 h30 M22,32 l22,20" stroke="#5fd3c4" stroke-width="3"/><text x="6" y="66" font-size="9" fill="#5fd3c4">25 · READY</text></g>
      <g transform="translate(148 0)"><rect width="66" height="70" fill="#151514" stroke="#55554f"/><rect width="66" height="14" fill="#2d2d2b"/><text x="6" y="11" font-size="10" fill="#777">C DECOY</text><rect x="8" y="22" width="50" height="40" fill="url(#hazard)" opacity="0.35"/><text x="18" y="48" font-size="14" fill="#ffb347">3.2</text></g>
    </g>
    <g transform="translate(1256 22)" text-anchor="end">
      <polygon points="0,0 -220,0 -232,12 -232,52 0,52" fill="#151514" stroke="#55554f"/>
      <text x="-12" y="20" font-size="12" fill="#9a9a90" letter-spacing="2">PULSE RIFLE</text>
      <text x="-12" y="42" font-size="18" fill="#e9ecea">∞  <tspan font-size="11" fill="#9a9a90">Q/E</tspan></text>
    </g>
    <g transform="translate(860 616)">
      <rect width="396" height="58" fill="#151514" stroke="#cfe8ff" stroke-opacity="0.5"/>
      <rect x="0" y="0" width="6" height="58" fill="#cfe8ff"/>
      <text x="18" y="22" font-size="11" fill="#cfe8ff" letter-spacing="2">ECHO · INFERENCE</text>
      <text x="18" y="44" font-size="13" fill="#e9ecea" font-family="'Microsoft YaHei', sans-serif">门锁读的是 R-2 的输出，不是门本身。</text>
    </g>
  </g>
  <rect x="440" y="684" width="400" height="24" fill="#ffb347"/>
  <text x="640" y="701" text-anchor="middle" font-size="12" fill="#111" font-family="'Microsoft YaHei', sans-serif">CONCEPT B · BRUTALIST RELAY 粗野中继 · 概念样稿，非实机截图</text>
</svg>
