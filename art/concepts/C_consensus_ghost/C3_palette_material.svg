<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>CONCEPT C · CONSENSUS GHOST — semantic palette, value check, materials, light</title>
  <defs>
    <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="in" result="m"/>
      <feBlend in="SourceGraphic" in2="m" mode="multiply"/>
    </filter>
    <pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#15151a"/></pattern>
    <g id="sw">
      <rect x="0" width="140" height="90" fill="#d9d6cf"/><rect x="150" width="140" height="90" fill="#0b0b0e"/>
      <rect x="300" width="140" height="90" fill="#f6f4ef" stroke="#15151a" stroke-width="3"/><rect x="450" width="140" height="90" fill="#ff5a1f"/>
      <rect x="600" width="140" height="90" fill="#15151a"/><rect x="750" width="140" height="90" fill="#00b8d4"/>
      <rect x="900" width="140" height="90" fill="#007f8c"/><rect x="1050" width="140" height="90" fill="#f4c430"/>
      <rect x="1200" width="140" height="90" fill="#e0447c"/><rect x="1350" width="140" height="90" fill="url(#ht)"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#eeebe4"/>
  <text x="40" y="52" fill="#15151a" font-size="24" letter-spacing="2">C · CONSENSUS GHOST — COLOR &amp; MATERIAL 色彩与材质</text>
  <text x="40" y="78" fill="#15151a" fill-opacity="0.6" font-size="13">Concept board. Ink + porcelain carry everything; C/M/Y "plates" exist only to show un-agreed state. 概念样稿。</text>
  <g transform="translate(40 110)">
    <use href="#sw"/>
    <g font-size="12" fill="#15151a">
      <text y="112">ENV 瓷面</text><text y="128" fill-opacity="0.6">#D9D6CF</text>
      <text x="150" y="112">SHADOW 暗场</text><text x="150" y="128" fill-opacity="0.6">#0B0B0E</text>
      <text x="300" y="112">EXECUTOR 瓷白+墨线</text><text x="300" y="128" fill-opacity="0.6">#F6F4EF / #15151A</text>
      <text x="450" y="112">HOSTILE 光圈</text><text x="450" y="128" fill-opacity="0.6">#FF5A1F · 2.5:1 on porcelain</text>
      <text x="600" y="112">HOSTILE MASS 墨体</text><text x="600" y="128" fill-opacity="0.6">#15151A · ~16:1</text>
      <text x="750" y="112">PLATE C 青版</text><text x="750" y="128" fill-opacity="0.6">#00B8D4 · 1.9:1</text>
      <text x="900" y="112">INTERACT 深青</text><text x="900" y="128" fill-opacity="0.6">#007F8C</text>
      <text x="1050" y="112">PLATE Y / RARE 黄版</text><text x="1050" y="128" fill-opacity="0.6">#F4C430</text>
      <text x="1200" y="112">PLATE M 品版</text><text x="1200" y="128" fill-opacity="0.6">#E0447C</text>
      <text x="1350" y="112">SIGNAL 网点密度</text><text x="1350" y="128" fill-opacity="0.6">halftone</text>
    </g>
    <text y="150" font-size="10" fill="#b0281e">RISK: magenta plate vs hostile orange-red are close for protan/deutan viewers; plate colours have low contrast on porcelain — meaning must also come from offset distance + labels.</text>
  </g>
  <g transform="translate(40 296)"><text y="-8" font-size="12" fill="#15151a">VALUE CHECK 灰度检验</text><g filter="url(#gray)" transform="scale(1 0.4)"><use href="#sw"/></g></g>
  <g transform="translate(40 360)" font-size="12" fill="#15151a">
    <text y="-10">MATERIALS 材质</text>
    <g><rect width="240" height="180" fill="#e9e6df" filter="url(#grain)"/><g stroke="#15151a" stroke-opacity="0.15"><path d="M0,60 H240 M0,120 H240 M80,0 V180 M160,0 V180"/></g><text y="200">GLAZED TILE 釉面砖</text></g>
    <g transform="translate(260 0)"><rect width="240" height="180" fill="#d9d6cf" filter="url(#grain)"/><g style="mix-blend-mode:multiply"><rect x="40" y="40" width="140" height="100" fill="#00b8d4" opacity="0.5" transform="translate(-8 3)"/><rect x="40" y="40" width="140" height="100" fill="#e0447c" opacity="0.5" transform="translate(7 -4)"/><rect x="40" y="40" width="140" height="100" fill="#f4c430" opacity="0.5" transform="translate(1 5)"/></g><rect x="40" y="40" width="140" height="100" fill="none" stroke="#15151a"/><text y="200">MISREGISTERED PANEL 失准印版</text></g>
    <g transform="translate(520 0)"><rect width="240" height="180" fill="#eeebe4"/><rect width="240" height="180" fill="url(#ht)" opacity="0.6"/><text y="200">SIGNAL HALFTONE 信号网点</text></g>
    <g transform="translate(780 0)"><rect width="240" height="180" fill="#15151a"/><circle cx="120" cy="90" r="30" fill="#ff5a1f"/><circle cx="120" cy="90" r="30" fill="#15151a" opacity="0.2" transform="translate(18 -6)"/><text y="200" fill="#15151a">INK BODY + APERTURE 墨体 + 光圈</text></g>
    <g transform="translate(1040 0)"><rect width="240" height="180" fill="#0b0b0e"/><ellipse cx="120" cy="140" rx="110" ry="30" fill="#e9e6df" opacity="0.8"/><rect x="100" y="0" width="40" height="120" fill="#e9e6df" opacity="0.06"/><text y="200">SINGLE OVERHEAD POOL 单顶光</text></g>
    <g transform="translate(1300 0)"><rect width="220" height="180" fill="#6b3a2a"/><rect x="30" y="30" width="160" height="120" fill="#d9d6cf"/><polygon points="120,30 190,30 190,150 150,150 160,90" fill="#6b3a2a"/><text y="200">TORN GLAZE 釉面剥落</text></g>
  </g>
  <g transform="translate(40 640)" font-size="13" fill="#15151a">
    <text>• 最强的世界观隐喻："共识"失败 = 印刷失准。位移量直接编码不稳定程度，可学习、可测试（GDB 2.2 第6–7条）。</text>
    <text y="26">• 高明度世界在小游戏市场中极少见，截图辨识度最高；但大面积亮场在长时间战斗中易疲劳，敌弹需深色描边。</text>
    <text y="52">• Canvas 可实现：MULTIPLY/SCREEN 混合为 Canvas+WebGL 共有（Phaser BlendModes）；失准 = 同一贴图 2–3 次偏移绘制。</text>
    <text y="78">• 风险：易被误读为"故障风/glitch"；必须提供关闭/减弱选项（AR-06 强闪/扰动开关）。</text>
  </g>
</svg>
